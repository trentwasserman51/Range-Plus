<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<title>Practice Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1c; --panel:#121a2e; --panel2:#18223b; --line:#25304d;
  --text:#e8ecf5; --muted:#8b95b0; --blue:#1f4fb8; --blue2:#3a6ff0;
  --gold:#f2b705; --gold2:#ffd24a; --red:#ef5350;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 96px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0a0f1c 80%,rgba(10,15,28,0));padding:12px 14px 6px}
.hrow{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px;letter-spacing:.5px;text-transform:uppercase}
.brand b{color:var(--gold)}
.teams{max-width:720px;margin:10px auto 0;display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.teams button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.teams button.on{background:var(--blue);color:#fff;box-shadow:inset 0 -2px 0 var(--gold)}
h2{font-family:"Barlow Condensed",sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:11px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#111a33;border-color:var(--gold)}
.btn.blue{background:var(--blue);border-color:var(--blue2);color:#fff}
.btn.danger{color:var(--red);border-color:#4a2530}
.btn.full{width:100%}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.plan{display:block;width:100%;text-align:left}
.plan .t{font-weight:700;font-size:16px}
.bar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--panel2);margin-top:10px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin:0 0 5px}
.in{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}
.in:focus{border-color:var(--blue2)}
textarea.in{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.blk{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.blk .stripe{width:6px;flex:none}
.blk .body{flex:1;min-width:0;padding:10px 12px}
.blk .time{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;color:var(--gold2)}
.blk .nm{font-weight:700}
.blk .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.stations{margin-top:6px;font-size:13px}
.stations div{padding:3px 0;border-top:1px dashed var(--line)}
.blk .acts{display:flex;flex-direction:column;border-left:1px solid var(--line)}
.blk .acts button{flex:1;padding:0 12px;color:var(--muted);font-size:15px;min-height:30px}
.blk .acts button:active{background:var(--panel2)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{flex:none;padding:7px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--blue);color:#fff;border-color:var(--blue2)}
.drill{display:flex;gap:10px;align-items:flex-start}
.dot{width:10px;height:10px;border-radius:3px;flex:none;margin-top:6px}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:var(--panel2);border-radius:10px;padding:9px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:24px;color:var(--gold2)}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,26,46,.97);border-top:1px solid var(--line);z-index:6}
nav .in2{max-width:720px;margin:0 auto;display:flex}
nav button{flex:1;padding:10px 4px 14px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--gold)}
nav svg{width:22px;height:22px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;padding:16px 16px 28px}
.sheet h3{margin:0 0 12px;font-family:"Barlow Condensed",sans-serif;font-size:22px;text-transform:uppercase}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:42px;height:42px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:16px}
.stepper .v{flex:1;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700}
.st-row{display:grid;grid-template-columns:1fr 1.4fr 1fr 34px;gap:6px;margin-bottom:6px}
.st-row .in{padding:8px}
.x{color:var(--muted);font-size:18px}
.mt{margin-top:12px}.mt2{margin-top:20px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
/* dugout card */
.dcard{background:#f7f5ee;color:#111;border-radius:12px;padding:18px 16px;font-family:Inter,sans-serif}
.dcard .hd{border-bottom:3px solid #1f4fb8;padding-bottom:8px;margin-bottom:8px}
.dcard .ttl{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:800;text-transform:uppercase;color:#1f4fb8;line-height:1}
.dcard table{width:100%;border-collapse:collapse;font-size:13.5px}
.dcard td{padding:7px 4px;border-bottom:1px solid #ddd;vertical-align:top}
.dcard td.tm{white-space:nowrap;font-weight:700;width:1%;padding-right:10px}
.dcard td.mn{white-space:nowrap;text-align:right;color:#555;width:1%}
.dcard .sub{font-size:12px;color:#444;margin-top:2px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700;text-transform:uppercase;padding:4px 0}
.mcell{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:64px;padding:5px;text-align:left;font-size:12px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.mcell.out{opacity:.35}.mcell.today{border-color:var(--gold)}
.mcell .n{font-weight:700}
.mcell .pd{display:block;font-size:10.5px;text-align:center;font-weight:600;background:var(--blue);border-radius:4px;padding:1px 3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dayhd .dn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;text-transform:uppercase}
.calnav{display:flex;align-items:center;gap:8px}
.calnav .lbl{flex:1;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px}
.calnav button.ar{width:40px;height:40px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:18px}
.dayplan{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:6px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.gh{background:#1f4fb8;color:#ffd24a;font-weight:700;padding:6px 8px;border-radius:6px 6px 0 0;text-transform:uppercase;font-size:13px;letter-spacing:.3px;display:flex;justify-content:space-between}
.quote{border:2px solid #1f4fb8;border-radius:8px;padding:8px 10px;margin-top:12px;font-style:italic;font-size:14px}
.dsc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.drill.open .dsc{display:block}
.vrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.vrow:last-child{border-bottom:0}
.vrow .ic{width:28px;height:28px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;color:var(--gold)}
.vrow .go{color:var(--muted);font-size:13px}
.vgh{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;color:var(--gold2);font-size:16px;margin:14px 0 6px}
.watch{display:inline-block;margin-top:6px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--gold2);font-size:12.5px;font-weight:600;text-decoration:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:#111a33;font-weight:700;padding:10px 16px;border-radius:10px;z-index:30}
</style>

function trimMins(blocks,T){
  if(!blocks.length||T<=0) return;
  const n=blocks.length; const per=Math.floor(T/n/5)*5; let rem=T-per*n;
  blocks.forEach((b,i)=>{let cut=per+(i===0?rem:0); b.min=Math.max(5,b.min-cut);});
}
function trimmed(src,T,newStart,teamOnly){
  const c=JSON.parse(JSON.stringify(src)); const off=toM(newStart)-toM(c.start); c.start=newStart;
  const ind=c.blocks.filter(b=>b.cat==='indy');
  trimMins(ind.length?ind:[...c.blocks].sort((a,b)=>b.min-a.min).slice(0,2),T);
  (c.groups||[]).forEach(g=>{ if(!g.blocks.length) return; g.start=fmt24(toM(g.start)+off);
    trimMins(g.blocks.filter(b=>!['throw','warm'].includes(b.cat)),T); });
  if(teamOnly){
    const g=(c.groups||[]).find(g=>g.blocks.length), i=c.blocks.findIndex(b=>b.cat==='indy');
    if(g&&i>=0){ const rest=c.blocks.filter(b=>b.cat!=='indy'); const before=c.blocks.slice(0,i).filter(b=>b.cat!=='indy').length;
      rest.splice(before,0,...g.blocks.map(b=>({...b,stations:[],notes:b.notes==='Details to come'?b.notes:''})));
      c.blocks=rest; }
    else c.blocks=c.blocks.map(b=>b.cat==='indy'?{...b,cat:'team',stations:[]}:b);
    c.groups=[]; c.focus=(c.focus||'').replace(/individual work/i,'Team fielding & hitting');
  }

}

if(!S.gbV1){ const GB=[{"lib": "inf", "cat": "def", "name": "Everydays", "min": 10, "desc": "Your routine. Tap \u270e to add the steps, reps and coaching points."}, {"lib": "inf", "cat": "def", "name": "Hack routine", "min": 10, "desc": "Your routine. Tap \u270e to add the steps, reps and coaching points."}, {"lib": "inf", "cat": "def", "name": "Picks & Tags", "min": 10, "desc": "Your routine. Tap \u270e to add the steps, reps and coaching points."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Routine (at you)", "min": 5, "desc": "Ball hit right at the fielder at normal speed.\nSetup: fungo or roll, 15\u201320 reps.\nCues: feet working early, get around the ball slightly to create a line to 1B, wide base, glove out front, funnel to the belly, right-left through the throw.\nWatch for: sitting back and letting the ball play you."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Short hop", "min": 5, "desc": "Ball arrives on the short hop right at the glove.\nSetup: partner short-hop tosses from 15\u201320 ft, then fungo.\nCues: glove out front and down early, push through the ball forward (don't pull back), soft hands go TO the ball, eyes stay on it into the glove.\nWatch for: stabbing up or recoiling the glove."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Long hop", "min": 5, "desc": "Ball takes a big, true hop before it reaches the fielder.\nSetup: fungo with high bounces from a little farther out.\nCues: read it early, adjust the feet to catch it at the top of the hop or on the way down, stay athletic and move through the catch.\nWatch for: drifting back and getting caught in-between."}, {"lib": "inf", "cat": "def", "name": "Ground ball: In-between hop", "min": 6, "desc": "Ball would reach the fielder on an awkward middle hop.\nSetup: fungo, coach varies the hop on purpose.\nCues: make a decision early: come in to short-hop it or give ground for the long hop. Never sit and wait.\nWatch for: freezing. Count hops to sharpen the early read."}, {"lib": "inf", "cat": "def", "name": "Ground ball: High chopper (charge)", "min": 6, "desc": "Big chop off the plate the fielder must attack.\nSetup: fungo chop off home plate, 8\u201310 reps.\nCues: charge hard, take the ball at the top of the hop or on the way down, field it on the move and throw through.\nWatch for: waiting for it to come down."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Slow roller \u2014 glove", "min": 6, "desc": "Slow ball in front of the fielder taken with the glove.\nSetup: roll or soft fungo, 8\u201310 reps each side.\nCues: charge under control, gather beside the ball with the glove-side foot, field off the lead foot and throw through on the run.\nWatch for: stopping to set the feet."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Slow roller \u2014 barehand", "min": 6, "desc": "Dying ball taken with the throwing hand.\nSetup: roll balls that are almost stopped.\nCues: approach slightly to the side, scoop with fingers under the ball on the throwing-side foot, throw on the next step from a lower slot.\nWatch for: trying to barehand a ball still rolling hard (use the glove)."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Forehand (routine)", "min": 5, "desc": "Ball to the glove side at a playable pace.\nSetup: fungo or roll 2\u20133 steps to the glove side.\nCues: crossover, get around and square up if time allows, glove out front, replace feet into a set throw.\nWatch for: reaching across the body without moving the feet."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Forehand on the run", "min": 6, "desc": "Glove-side ball where you can't stop and set.\nSetup: fungo farther to the glove side.\nCues: open up and run, field on the move off the glove-side foot, plant and throw or throw through.\nWatch for: drifting away from the target after the catch."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Backhand (routine)", "min": 5, "desc": "Ball to the backhand side 1\u20132 steps over.\nSetup: fungo or roll to the backhand.\nCues: drop step, field it out front of the throwing-side foot, glove open with the fingers down, plant and work up to the throw.\nWatch for: letting the ball get behind you."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Backhand in the hole (plant and throw)", "min": 6, "desc": "Deep backhand that needs a strong plant.\nSetup: fungo deep in the hole, SS and 3B.\nCues: take the right angle back, catch off the right foot, hard plant on the right leg, stay tall and drive the throw.\nWatch for: falling away from 1B on the throw."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Backhand \u2014 jump throw", "min": 6, "desc": "Deep backhand when there's no time to plant.\nSetup: fungo deep in the hole, start slow.\nCues: catch it, gather, jump up off the right foot and throw with the shoulders turned toward the target.\nWatch for: jumping before the ball is secure."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Up the middle", "min": 6, "desc": "Ball up the middle past the bag.\nSetup: fungo up the middle from both SS and 2B.\nCues: good angle, field on the run, throw across the body or spin depending on momentum, use the bag as a landmark.\nWatch for: rushing the throw before the feet turn toward 1B."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Hard hit / rocket at you", "min": 5, "desc": "Ball scorched right at the fielder with no time to move.\nSetup: hard fungo or machine from shorter distance.\nCues: stay down, glove out front, hands soft and quick, block it if needed and keep it in front.\nWatch for: turning the head or flinching."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Dive \u2014 glove side", "min": 6, "desc": "Ball out of reach to the glove side.\nSetup: soft fungo or roll on grass, mats if available.\nCues: stay low, dive out (not down) leading with the glove, get up fast to the knees or feet and throw.\nWatch for: diving too early or landing on the glove."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Dive \u2014 backhand", "min": 6, "desc": "Ball out of reach to the backhand side.\nSetup: soft fungo or roll on grass.\nCues: dive from low, glove backhand out front, recover to the feet quickly and set a throw or make an off-balance throw.\nWatch for: getting up too slow."}, {"lib": "inf", "cat": "def", "name": "Ground ball: Do-or-die", "min": 6, "desc": "Ball that requires a full charge with no time.\nSetup: fungo slow rollers with a runner or game clock.\nCues: attack, field on the run, throw off-balance or underhand if needed. Make the play or lose it on effort, never on hesitation.\nWatch for: half-charging."}]; GB.slice().reverse().forEach(d=>{ if(!S.drills.some(x=>x.name===d.name)) S.drills.unshift({id:uid(),custom:true,...d}); }); S.gbV1=true; }

if(!S.brV1){ const BR=[{"lib":"br","cat":"br","name":"Weekly steal-start schedule (New / Old school)","min":0,"desc":"New School days: Mon / Wed / Fri, 6' leads.\nOld School days: Tue / Thu / Sat, 12' leads.\nSunday: team baserunning.\nEvery rep is live. Know which type of day it is before stepping on the bag.","video":""},{"lib":"br","cat":"br","name":"Home to 1st \u2013 breakdown + read","min":8,"desc":"3 reps (70\u201380% effort, stride it out, get the technique right). Coach drops the ball or doesn't.\n\u2022 Swing, run to first\n\u2022 Same speed THROUGH the bag, touch the FRONT of the bag\n\u2022 Break down, peek right, make the CORRECT read\n\u2022 Run through halfway to 2nd","video":""},{"lib":"br","cat":"br","name":"Home to 1st with a turn + read","min":8,"desc":"3 reps. Cycle the ball through LF, CF, RF.\n\u2022 Run to first, touch the INSIDE part of the bag\n\u2022 Get out to the cone\n\u2022 Read: return OR get to second","video":""},{"lib":"br","cat":"br","name":"For-sure doubles (double out of the box)","min":6,"desc":"2 reps. Home to 2nd.\n\u2022 Get out wide early\n\u2022 Inside part of the bag\n\u2022 Narrow turn around first","video":""},{"lib":"br","cat":"br","name":"6' lead walk-outs (New School)","min":5,"desc":"x5 eyes open, x2\u20133 eyes closed.\nCheck distance, jab, shuffle, stick.","video":""},{"lib":"br","cat":"br","name":"12' lead walk-outs (Old School)","min":5,"desc":"x5 eyes open, x2\u20133 eyes closed. GET IT RIGHT.\nLeft, right, pivot, shuffles.","video":""},{"lib":"br","cat":"br","name":"Returns \u2013 6' and 12'","min":6,"desc":"x4 at each distance (3 at 6': one left foot, one right foot, one shuffle to left foot).\nRead off RHP: runner knows a pickoff is coming, just not when.\nCROSSOVER, get low, push with right hand, extend left hand to the back corner.","video":""},{"lib":"br","cat":"br","name":"New School shuffle","min":10,"desc":"Off RHP from a 6' lead.\n\u2022 x5 methodical, x5 rhythm, x5 eyes closed\n\u2022 x5 shuffle, perfect timing, GO\n\u2022 x5 shuffle + return\nCombos: 2 jab steps \u2192 shuffle \u2192 stick / \u2192 perfect timing, go / \u2192 stick, old school return / \u2192 plant mid-shuffle, old school return.","video":""},{"lib":"br","cat":"br","name":"New School reads (U-C-L-A calls)","min":10,"desc":"5\u20136 reps off RHP. Each time the pitcher comes set, the group says U, C, L, A out loud. Runners shuffle on L. Pitcher picks or goes home whenever: time it up without getting picked off.\nSample call sequence: pick on C \u00b7 hold past A, reset \u00b7 pitch on A \u00d73 \u00b7 pick on L \u00b7 pick before coming set \u00b7 pick on A \u00b7 pitch on A \u00b7 pick on C. After that mix it up; if you pitch it, it's on A.\nEmphasize the CROSSOVER step on returns.","video":"https://drive.google.com/file/d/1qv4A7jxZerG8jYF2WQAoeaZX7WdROgIA/view"},{"lib":"br","cat":"br","name":"Old School reads off RHP","min":10,"desc":"5\u20136 reps, very basic. Get the best jump on leg lift and the best reaction on the pickoff.\nMix it up: 3 steals, 2 returns, 1 quick pick mixed in.","video":""},{"lib":"br","cat":"br","name":"Old School reads off LHP","min":8,"desc":"Mix it up plus 1 step-off quick pick.\n\u2022 3 jab step + secondary\n\u2022 1 first-move steal\nAlso teach the one-way lead off LHP.","video":""},{"lib":"br","cat":"br","name":"Slide step vs. leg kick reads","min":6,"desc":"Off RHP from 12'. No quick pick: 1 pickoff, 2 slide steps, 2 leg kicks, mixed up.","video":""},{"lib":"br","cat":"br","name":"12' secondary leads","min":6,"desc":"Eyes closed walk out, then secondary.\n3 secondaries off RHP, 3 off LHP.","video":""},{"lib":"br","cat":"br","name":"Steal start times (timed)","min":20,"desc":"100% effort, about 25 yds (75 ft), timed on lasers.\n\u2022 2 runners at a time, walk out a 12' lead (back foot at 12)\n\u2022 RHP either picks or pitches. Need 3 timed reps each; only a few picks\n\u2022 2.5 min rest between sprints\n\u2022 NO REDOS. Bad jump counts, back of the line\n\u2022 Pick once per group of two: 3 sprints + 1 dive back\nTrack good jumps, bad reps and pickoffs.","video":"https://drive.google.com/file/d/13ZPGdqQLUB-8Rv5UfVsdJIS7z3qizk7D/view"},{"lib":"br","cat":"br","name":"30-yard sprints from steal start","min":15,"desc":"2\u20133 sprints at 100% effort from the base-stealing start. 3 minutes rest. 2 lanes. Time them if you have lasers.","video":""},{"lib":"br","cat":"br","name":"Live dirt ball reads","min":15,"desc":"Split runners evenly across the bases, 2 runners up each time.\n\u2022 LHP lead at 1st, 18' lead at 2nd, 3B leads based on cones\n\u2022 Secondary lead + read the ball out of the hand\n\u2022 Catchers may make throws","video":"https://drive.google.com/file/d/1oMdjoKMMeu5T7r7DNSfjixNOeOhXr1yc/view"},{"lib":"br","cat":"br","name":"Reads at 2nd base","min":15,"desc":"\u2022 Shuffle start, crossover start, first-move start\n\u2022 1 look, 2 looks, 3 looks\n\u2022 Inside move\n\u2022 Verbals","video":""},{"lib":"br","cat":"br","name":"2nd base situations","min":15,"desc":"\u2022 Leads with less than 2 outs vs 2 outs\n\u2022 Verbiage\n\u2022 Secondary\n\u2022 Fly balls / line drives: 0, 1, 2 outs\n\u2022 Ground balls at, behind, and vs the shift","video":""},{"lib":"br","cat":"br","name":"3rd base walk-through","min":15,"desc":"Leads at 3rd \u00b7 secondary lead \u00b7 down angle \u00b7 fly balls / line drives \u00b7 dirt balls \u00b7 rundowns \u00b7 baseline \u00b7 leads with a runner on first.","video":""},{"lib":"br","cat":"br","name":"Jump tracker","min":0,"desc":"During any live read drill, track each runner's good jumps, bad reps and pickoffs. Compare by speed group (3.2s, 3.3s, 3.4s\u2026).","video":""},{"lib":"br","cat":"br","name":"Momentum steals (vault / walking lead)","min":10,"desc":"Walking-lead and vault steal starts: build momentum before the pitcher commits. Watch the clips in Videos \u203a Momentum Steals.","video":"https://drive.google.com/drive/folders/10uCczwPfM1B1XuJeK5ba7H3r2tyOVWOi"},{"lib":"br","c n": 10, "desc": "Infield video · 3B", "video": "https://drive.google.com/file/d/1GSTEWt0mxGY5pEWfGDOks089IDIMqASd/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Barehand Slow Roller", "min": 10, "desc": "Infield video · 3B", "video": "https://drive.google.com/file/d/1s82kVpZ3RQ-jk1OTo87lY4g1Alhg3L7M/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Barehand Slow Roller 2", "min": 10, "desc": "Infield video · 3B", "video": "https://drive.google.com/file/d/1HwxNuyrg543ldbpfv6nG6OIyAgv6Gmwo/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Forehand 6 Hole On The Run", "min": 10, "desc": "Infield video · 3B", "video": "https://drive.google.com/file/d/1Eo06xPSb_3hVJy6oR8MXIhqPQhx1zAaO/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Forehand Creating Space, Short Hop", "min": 10, "desc": "Infield video · 3B", "video": "https://drive.google.com/file/d/1TjEAbs8mnoDk46d0asFNMatdY46JWYr6/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Forehand Spin", "min": 10, "desc": "Infield video · 3B", "video": "https://drive.google.com/file/d/13sHPs54sTbH8sxmlW4mKuWCQ_sSH9CNR/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Routine 2 Hand & Forehand On-the-run", "min": 10, "desc": "Infield video · 3B", "video": "https://drive.google.com/file/d/1rbdCB8vreH7ZGcbP_UcExkv2kWtIY55P/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Routine 2 Hand DP Start", "min": 10, "desc": "Infield video · 3B", "video": "https://drive.google.com/file/d/1y_FPLweNoZxQ5anmoqJPct64LfoSgq6x/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Routine DP Start & Barehand Play", "min": 10, "desc": "Infield video · 3B", "video": "https://drive.google.com/file/d/1W8RvcwHdEhWJuZX0ruZ9EwbRKpaWf9aH/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Slow Roller", "min": 10, "desc": "Infield video · 3B", "video": "https://drive.google.com/file/d/1l7dEtVKiZJhdHOZVOPeXu9J6NPBwvfHm/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": ", "cat": "def", "name": "Backhands", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/1Uaswld5NcE60sI0_kRZUjSZ2KKnm6M6G/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Iglesias Unreal Glove Flip", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/1GjKVq8QZPjQteIDyU17_1Ey-qKJo92rN/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Jump Throw - Story", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/143tFIyRLORvgx6ZLduooZ1OmpbamKekg/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Jump Throw - Witt", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/1swKQuwV4uSIfqagFwSobnKPvVXATUsaJ/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Routine Plays", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/1rf-_66YsbxhlEVnvNPuw4eRl6Y5mw8td/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Slow Roller Barehand", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/1Aqv5fcJeCSLNKWPuMBB6ZsEcToGa0t9m/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Slow Roller Barehand 2", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/1jYFy3aQ1esVvnMmLtpZcSnTlcER_sri_/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Slow Roller With Time", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/15fwr2h6plTXHSEcb_uSEJJgGUXdHxJg3/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "Slow Rollers - Left Side", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/18UsNtJMn5ttjOQEVMP8l_4o6bLyUJ_Gm/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "UTM Flip The Hips", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/1RiGx9HSVXmI62koQjzbNVDFxeYP9PZyV/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "UTM Spin Move", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/1Kt2PLcht_8vSIrNWGfcOVDAUhYyvsLTb/view?usp=drivesdk"}, {"lib": "inf", "cat": "def", "name": "UTM Spin Move 2", "min": 10, "desc": "Infield video · SS", "video": "https://drive.google.com/file/d/1L4tWeIGd4-W7asSKDTcJZFuXqo_SwcaB/view?usp=drivesdk"}]; DF.forEach(d=>{ const ex=S.drills.find(x=>x.lib===d.lib&&x.name.toLowerCase()===d.name.toLowerCase()); if(ex){ if(!ex.video) ex.video=d.video; } else S.drills.push({id:uid(),custom:true,...d}); }); S.defV1=true; }
if(!S.wwV1){ const WW=[{"lib": "inf", "cat": "def", "name": "Wall ball routine", "min": 10, "desc": "Glove work off a wall or rebounder, 8\u201315 ft away, with a tennis or rubber ball. Throw at a set height to control the hop.\n1) Two-hand short hops: 15\n2) Glove hand only: 10\n3) Forehands, both sides of the body: 10\n4) Backhands: 10\n5) Short-hop picks, glove out front and through the ball: 10\n6) Quick transfers, catch and pull to the throwing ear: 15\n7) Rollers with the barehand: 5\nCues: low base, glove out in front, soft hands go to the ball, eyes stay on it into the glove. Move closer or throw harder to make it tougher."}, {"lib": "inf", "cat": "def", "name": "Walker routine", "min": 8, "desc": "Fielding in rhythm on the move. Partner or coach 20\u201330 ft away rolls or fungos as the fielder walks in.\n1) Walkers at you, right-left, field, right-left: 10\n2) Walkers to the forehand: 8\n3) Walkers to the backhand: 8\n4) Slow-roller walkers, glove: 6\n5) Slow-roller walkers, barehand: 6\n6) Walkers with a throw to a target: 10\nCues: feet never stop, time the steps so the glove-side foot lands as the ball arrives, glove out front, work through the ball toward the target."}]; const at=S.drills.findIndex(x=>x.name==='Picks & Tags'); WW.forEach((x,k)=>{ if(!S.drills.some(y=>y.name===x.name)) S.drills.splice(at>=0?at+1+k:0,0,{id:uid(),custom:true,...x}); }); S.wwV1=true; }
if(!S.infV1){ const INF=[{"lib":"inf","cat":"def","name":"Game Clock (Meet or Beat Clock)","min":15,"desc":"High intensity\nA play is made while a shot clock runs from the ball being hit or fielded to glove-to-target. He has to meet or beat the time standard.\nUse for: For a player whose throws are accurate but late, or who loses time in the transfer and feet under pressure.\nWhy: The clock gives him an objective target instead of a feel. He learns the pace the play really needs, cuts wasted movement between catch and release, and gets used to throwing on time without giving up accuracy."},{"lib":"inf","cat":"def","name":"Separator Play","min":15,"desc":"High intensity\nA full play, from ball to throw, on a chance hard enough to separate good defenders from average ones, run at game intensity.\nUse for: For a player whose routine plays are fine but whose 4–5★ results sit below expected, or who needs to push his range out. Tough chances are where outs above average come from.\nWhy: Reps at the edge of his range teach him what he can reach and how to finish the play from there. Keep it near a 70% success rate: if he makes everything, move the ball farther."},{"lib":"inf","cat":"def","name":"Situational Separator Play","min":15,"desc":"High intensity\nThe same hard play with a game situation attached, such as runner speed, number of outs and which base to throw to.\nUse for: For a player who makes the play in practice but loses tempo or makes the wrong throw decision with a runner or the clock in mind.\nWhy: It adds decision and urgency to the physical skill, so his throw choice and speed match what the game demands."},{"lib":"inf","cat":"def","name":"Flip Fungo Mass","min":15,"desc":"High intensity\nA coach flips fungo grounders in quick succession and the fielder plays each one from pre-pitch through the throw.\nUse for: For high-volume work on the full play when he needs lots of quality reps in a short window, such as game prep.\nWhy: High-tempo reps off a real batted ball build rhythm between pre-pitch, first step, catch and throw, and sharpen the transfer and arm while he is a little tired."},{"lib":"inf","cat":"def","name":"Live BP w/o Runners","min":15,"desc":"High intensity\nThe fielder plays his position against live batting practice, reading real batted balls and throwing to a base. No runners.\nUse for: The closest thing to the game we can get. Use it when a skill looks good on a machine or fungo but does not show up in games, and to prepare for games.\nWhy: Real bat sound, spin and speed train reads and first step in a way a machine can not, and the throw finishes the play. Prioritize live reads across a whole development cycle."},{"lib":"inf","cat":"def","name":"BP Option 4 (Pre-Pitch Full Play)","min":15,"desc":"High intensity\nLive BP where he does his pre-pitch on every pitch and plays every ball hit to him all the way through the throw.\nUse for: For a player whose pre-pitch (being on the way down at contact) is inconsistent, so his first step and range suffer.\nWhy: It ties the pre-pitch timing to the pitch, so he learns to be moving at contact. Because he finishes the play, the better start carries into range, catch and throw."},{"lib":"inf","cat":"def","name":"Self Fed Mass Fungo","min":15,"desc":"High intensity\nThe player hits himself ground balls one after another and plays each one through the throw.\nUse for: For extra volume when no coach is available, or to groove footwork and the transfer on his own.\nWhy: Lots of repetition on catch and throw mechanics. It is weaker for range and first step because he knows where the ball is going, so pair it with batted-ball work."},{"lib":"inf","cat":"def","name":"Machine Range Ruler","min":15,"desc":"High intensity\nA machine shoots balls to spots farther and farther to either side so you can see how far he reaches, and he finishes with a throw.\nUse for: For a range problem: low range success, low OAA, or a weak side on the Direction columns. It gives a clear measure of how far he gets.\nWhy: The machine is precise, so he gets high-intensity, rangy reps at exact spots. He sees the edge of his range and the goal is to push it out over the weeks. Pre-pitch matters less here because there is no batted ball."},{"lib":"inf","cat":"def","name":"Random Flip Fungo w/ Throw","min":12,"desc":"Moderate intensity\nThe coach flips fungos to random spots and directions. The fielder plays each one and throws to a target.\nUse for: For a player who only looks good when he knows where the ball is going. It trains the whole play with variability.\nWhy: Unpredictable directions force real reads and first steps. Finishing with a throw to a target keeps ball security and the throw tied to the effort."},{"lib":"inf","cat":"def","name":"N/S/E/W Machine","min":12,"desc":"Moderate intensity\nThe machine feeds balls in four directions around the fielder (in, back, glove side, backhand side). No throw.\nUse for: For a player with a weak direction, such as the backhand side or charging in, and for first step and range work at high intensity.\nWhy: Reps in every direction expose a weak one and fix it. Skipping the throw keeps volume and intensity high, so you get more range reps in less time."},{"lib":"inf","cat":"def","name":"Machine Angle Work","min":12,"desc":"Moderate intensity\nThe machine feeds ground balls at different angles so he practices the footwork each path needs.\nUse for: For a player whose path to the ball is inefficient: an arc that is too wide, getting around the ball late, or poor footwork to one side.\nWhy: He repeats a clean angle until the path becomes automatic. That shows up as a direct path, a better first step and more range."},{"lib":"inf","cat":"def","name":"Flip Fungo Hop Reads","min":12,"desc":"Moderate intensity\nFlip fungos where the focus is reading the hop and choosing how to play it: short hop, long hop or in between.\nUse for: For a fielder who gets tied up by bad hops, hesitates, or lets the ball play him.\nWhy: Seeing many hops teaches him to pick the hop he wants and attack it, which helps ball security and the first step into the ball."},{"lib":"inf","cat":"def","name":"Count Hops","min":12,"desc":"Moderate intensity\nHe counts or calls out the hops as the ball comes to him.\nUse for: For a player who watches the ball late or stops reading the hops as it arrives.\nWhy: Counting keeps his eyes locked on the ball and forces an early read of the hop, so the catch gets cleaner."},{"lib":"inf","cat":"def","name":"BP Option 3 (Pre-Pitch to Catch)","min":12,"desc":"Moderate intensity\nLive BP: pre-pitch, first step, range and catch on every ball hit to him. He stops after the catch, no throw.\nUse for: For work on contact-to-catch when throwing volume is a concern or on a no-throw day.\nWhy: He gets many live reps at contact-to-catch, the biggest predictor of a defender's value, without adding arm stress."},{"lib":"inf","cat":"def","name":"Self Fed Fungo (Random)","min":12,"desc":"Moderate intensity\nHe hits himself ground balls to random spots and fields them, usually finishing with a throw.\nUse for: For general reps and footwork on his own when a coach is not available.\nWhy: Random spots keep it from becoming rote and the self-feed gives volume. Pre-pitch is light because he is the one hitting the ball."},{"lib":"inf","cat":"def","name":"DP Machine Ruler","min":10,"desc":"Low intensity\nA machine range ruler where each ball is played and turned as a double play, such as the feed or the turn.\nUse for: For a middle infielder who needs range and double-play footwork together. It is a low-workload version.\nWhy: It joins range with the feed or turn, so the footwork into the throw gets practiced while he stays on the move."},{"lib":"inf","cat":"def","name":"Red Rocket Ruler","min":10,"desc":"Low intensity\nA ruler drill using the Red Rocket, an easy machine that can shoot real baseballs, to spots at increasing distance.\nUse for: For range work on a low-workload day, or when only a simple machine is available.\nWhy: The same idea as the Machine Range Ruler at lower intensity: staying on the move through the ball and getting range reps without much stress on the body."},{"lib":"inf","cat":"def","name":"Random Flip Fungo w/o Throw","min":10,"desc":"Low intensity\nFlip fungos to random spots. He plays each ball to the catch and does everything but the throw.\nUse for: For a no-throw day, or when the arm needs a break.\nWhy: He keeps the first step, range and catch work and moves his feet toward the target without the throw. We call this everything but the throw."},{"lib":"inf","cat":"def","name":"BP Option 2 (Pre-Pitch 3 Steps)","min":10,"desc":"Low intensity\nLive BP: pre-pitch and the first three steps on every ball hit to him, then he stops.\nUse for: For a player who needs work on pre-pitch and first step but not the whole play.\nWhy: Low-workload reps that link timing and the first steps to a real pitch, building a first step that goes the right way."},{"lib":"inf","cat":"def","name":"BP Stop","min":10,"desc":"Low intensity\nLive BP: pre-pitch and the first step, then he stops and watches the ball finish.\nUse for: For a player whose pre-pitch or first step is the main issue.\nWhy: Very low workload. He gets many reps of getting on the way down at contact and reading the ball off the bat."},{"lib":"inf","cat":"def","name":"BP Option 1 (Pre-Pitch 1 Step)","min":10,"desc":"Low intensity\nLive BP: pre-pitch and a single first step on every ball, then he stops.\nUse for: For the lightest version of pre-pitch and first step work.\nWhy: It trains the most important start of the play, being on time with the feet, with almost no wear on the body."},{"lib":"inf","cat":"def","name":"Screened Pre Pitch","min":10,"desc":"Low intensity\nPre-pitch reps from behind a screen while a hitter or coach hits. The ball is not coming at him.\nUse for: For a player who needs pre-pitch timing reps with no risk, or a lot of reps in a short time.\nWhy: He practices organizing his feet to the pitch and the swing, so he is already moving when the ball is hit."},{"lib":"inf","cat":"def","name":"Turf Work","min":10,"desc":"Low intensity\nRoutine ground balls on turf, often with Lite Flite or real balls, usually with throwdown bases.\nUse for: A daily routine for every player. It builds confidence and ball security and lets you nudge small improvements.\nWhy: Quality catch reps in a controlled setting. It is the base the harder drills sit on, and it should be a daily part of programming."},{"lib":"inf","cat":"def","name":"Dual Machine Picks","min":10,"desc":"Low intensity\nTwo machines feed different hops so he has to pick the ball out of varied bounces.\nUse for: For a player who needs work on ball security and hand work, especially with mixed-bag balls.\nWhy: Varied hops force quick adjustments and clean catches. It trains the hands and the catch tool without needing range or a throw."},{"lib":"inf","cat":"throw","name":"Throw work: On the run","min":10,"desc":"Football throws on the run. Partners 40–60 ft apart. He jogs toward a throw line and throws on the move, like a quarterback rolling out, to both sides. 10–15 a day.\nFixes: Throws that go off line or late when he is moving through the ball: charge plays, slow rollers, bare-hand plays, and balls he fields on the move.\nProgression: 1) Walk through the throw at a target. 2) Jog and throw. 3) Field a short fungo or a roll, then throw through it. 4) Fungo or machine ball on the run with the game clock.\nReps: 10–15 football throws in catch play every day. On a High day, 5–8 on-the-run throws to a plyo-mat target after a real fielded ball."},{"lib":"inf","cat":"throw","name":"Throw work: Off-balance","min":10,"desc":"Throws from awkward spots. Partner calls the angle: across the body, off one knee, drifting sideways, after a quick spin. 8–10 a day at about 70% effort.\nFixes: Throws from awkward positions: across the body, falling away, from the knees, after a dive, or off the wrong foot.\nProgression: 1) Slow, from a knee. 2) Moving sideways with a drift. 3) After a quick spin or a ball to the backhand side. 4) Fungo or machine ball, then throw with the game clock.\nReps: 8–10 awkward-position throws in catch play each day. On a High day, play them off fungo or machine balls to a plyo-mat target."},{"lib":"inf","cat":"throw","name":"Throw work: Jump","min":10,"desc":"Jump throws in catch play after he is warm. Start at 40–50 ft at about 70% effort. 5–8 a day. Focus on the landing and keeping hips and shoulders pointed at the target.\nFixes: Jump throws from the hole or on the backhand side, where he has to leave the ground to get the ball across.\nProgression: 1) Standing jump throw at a short distance. 2) Jump after a backhand pick. 3) Jump from a deeper spot. 4) Fungo or machine ball, then jump throw with the clock.\nReps: 5–8 jump throws in catch play daily, and the same on a High day off a fungo ball."},{"lib":"inf","cat":"throw","name":"Throw work: Set","min":10,"desc":"Name the footwork pattern before each set of catch play: quick release, 1-step shuffle, 2-step shuffle, crow hop. 10 a day, to a target.\nFixes: Throws with time to set the feet that are still off line or late. These should be the most consistent throws.\nProgression: 1) Pattern at short distance. 2) Pattern at full distance. 3) Pattern off a fungo ball. 4) Pattern with the game clock.\nReps: 10 footwork-pattern throws in catch play every day, and again off fungo balls on Moderate and High days."},{"lib":"inf","cat":"throw","name":"Throw work: Flip","min":10,"desc":"Flips and underhand tosses from 15–30 ft, plus backhand flips. 10 a day, with a partner holding a target at chest height.\nFixes: Short flips and underhand tosses on double plays or plays near the bag that are soft, late or off target.\nProgression: 1) Set flip to a target. 2) Flip after a short ground ball. 3) Backhand flip. 4) Machine or fungo ball with the clock.\nReps: 10 flips in catch play daily and as part of any double-play drill."}]; INF.forEach(d=>{ if(!S.drills.some(x=>x.lib==='inf'&&x.name===d.name)) S.drills.push({id:uid(),custom:true,...d}); }); S.infV1=true; }

function toM(t){const[h,m]=(t||'15:00').split(':').map(Number);return h*60+m;}
function fmt(m,ampm){m=((m%1440)+1440)%1440;let h=Math.floor(m/60),mm=m%60;const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(mm).padStart(2,'0')+(ampm?' '+ap:'');}
function total(p){return p.blocks.reduce((a,b)=>a+(+b.min||0),0);}
const durStr=m=>m>=60?Math.floor(m/60)+'h '+(m%60?m%60+'m':''):m+'m';
const dateStr=d=>{try{return new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}catch(e){return d;}};
const curPlan=()=>S.plans.find(p=>p.id===editingId);

function catBar(p,withLegend){
  const t=total(p)||1, sums={};
  p.blocks.forEach(b=>sums[b.cat]=(sums[b.cat]||0)+(+b.min||0));
  const keys=Object.keys(CATS).filter(k=>sums[k]);
  let h='<div class="bar">'+keys.map(k=>`<span style="width:${sums[k]/t*100}%;background:${CATS[k].color}"></span>`).join('')+'</div>';
  if(withLegend) h+='<div class="legend">'+keys.map(k=>`<span><i style="background:${CATS[k].color}"></i>${CATS[k].label} ${sums[k]}m</span>`).join('')+'</div>';
  return h;
}

      ${b.stations.length?'<div class="stations">'+b.stations.map(st=>`<div><b>${esc(st.group)}</b> — ${esc(st.drill)}${st.coach?' <span class="muted">('+esc(st.coach)+')</span>':''}</div>`).join('')+'</div>':''}
    </div>

function cardText(p){
  const team=TEAMS.find(t=>t.id===p.team).name;
  let s=`${team.toUpperCase()} PRACTICE — ${dateStr(p.date)}\n${p.focus||''}\n${p.location||''}${p.gear?'\nGear: '+p.gear:''}\n`;
  const sec=(title,blocks,start)=>{if(!blocks.length)return; let c=toM(start); s+=`\n${title.toUpperCase()}\n`;
    blocks.forEach(b=>{const st=c;c+=+b.min;s+=`${fmt(st)}-${fmt(c)}  ${b.name}\n`;
      b.stations.forEach(x=>s+=`    • ${x.group}: ${x.drill}${x.coach?' ('+x.coach+')':''}\n`);
      if(b.notes) s+=`    ${b.notes}\n`;});};
  sec('Team schedule',p.blocks,p.start);
  p.groups.forEach(g=>sec(g.name+' indy',g.blocks,g.start));
  if(p.quote) s+=`\nQUOTE OF THE WEEK: "${p.quote}"\n`;
  if(p.notes) s+=`\nNOTES: ${p.notes}\n`;
  return s;
}
function cardTable(blocks,start,showMin){
  let c=toM(start);
  return `<table>${blocks.map(b=>{const st=c;c+=+b.min;return `<tr><td class="tm" style="border-left:4px solid ${(CATS[b.cat]||CATS.other).color};padding-left:6px">${fmt(st)}${showMin?'':'–'+fmt(c)}</td>
    <td><b>${esc(b.name)}</b>${b.stations.map(x=>`<div class="sub">• <b>${esc(x.group)}</b>: ${esc(x.drill)}${x.coach?' ('+esc(x.coach)+')':''}</div>`).join('')}${b.notes?`<div class="sub"><i>${esc(b.notes)}</i></div>`:''}</td>
    ${showMin?`<td class="mn">${b.min}m</td>`:''}</tr>`;}).join('')}</table>`;
}

function vVideos(){

  let h=`<h2>Videos / Thoughts</h2><div class="chips" style="flex-wrap:wrap">${VIDS.map(t=>`<button class="${t.id===tab.id?'on':''}" data-act="vidtab" data-id="${t.id}">${esc(t.name)} <span style="opacity:.6">${t.items.length}</span></button>`).join('')}</div>

    else if(!open){ h+='<div class="card" style="padding:0">'; open=true; }

function teamPlansOn(d){return S.plans.filter(p=>p.team===S.team&&p.date===d).sort((a,b)=>a.start.localeCompare(b.start));}
function vCal(){
  const td=todayISO();
  const tog=`<div class="chips mt" style="margin-bottom:6px"><button class="${calMode==='week'?'on':''}" data-act="calmode" data-id="week">Week</button><button class="${calMode==='month'?'on':''}" data-act="calmode" data-id="month">Month</button><span class="grow"></span><button data-act="caltoday">Today</button></div>`;
  if(calMode==='week'){
    const end=addDays(calWeek,6);
    const lbl=parseD(calWeek).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+parseD(end).toLocaleDateString(undefined,{month:parseD(end).getMonth()===parseD(calWeek).getMonth()?undefined:'short',day:'numeric'});
    const wk=S.plans.filter(p=>p.team===S.team&&p.date>=calWeek&&p.date<=end);
    const all={blocks:wk.flatMap(p=>p.blocks)}, tm=total(all);
    let h=tog+`<div class="calnav"><button class="ar" data-act="calprev">‹</button><div class="lbl">${lbl}</div><button class="ar" data-act="calnext">›</button></div>
    <div class="card mt"><div class="row"><div class="grow"><b>${wk.length} practice${wk.length===1?'':'s'}</b> <span class="muted">· ${durStr(tm)} planned</span></div>
    </div><div class="grid2 mt"><button class="btn sm gold" data-act="fillweek">Fill week</button><button class="btn sm" data-act="copyweek">Copy last week</button></div>${tm?catBar(all,true):'<div class="muted small mt">Nothing planned this week yet. Tap + Plan on a day, or copy last week.</div>'}</div>`;
    for(let i=0;i<7;i++){
      const d=addDays(calWeek,i), ps=teamPlansOn(d), dt=parseD(d);
      h+=`<div class="card" ${d===td?'style="border-color:var(--gold)"':''}><div class="dayhd"><span class="dn">${dt.toLocaleDateString(undefined,{weekday:'short'})}</span><span class="muted">${dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>${d===td?'<span class="pill" style="color:var(--gold)">Today</span>':''}<span class="grow"></span><button class="btn sm" data-act="newon" data-id="${d}">+ Plan</button></div>`;
      h+= ps.length? ps.map(p=>{const t=total(p);return `<button class="dayplan" data-act="open" data-id="${p.id}"><div class="row"><div class="grow"><b>${esc(p.focus||'Practice')}</b><div class="muted small">${fmt(toM(p.start),1)}–${fmt(toM(p.start)+t,1)}${p.location?' · '+esc(p.location):''}</div></div><span class="pill">${durStr(t)}</span></div>${catBar(p)}</button>`;}).join('')
        : '<div class="muted small">No practice</div>';
      h+='</div>';
    }
    return h;
  }
  const [y,m]=calMonth.split('-').map(Number);
  const first=calMonth+'-01', gs=weekStart(first);
  const lbl=parseD(first).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const mp=S.plans.filter(p=>p.team===S.team&&p.date.startsWith(calMonth));
  let h=tog+`<div class="calnav"><button class="ar" data-act="calprev">‹</button><div class="lbl">${lbl}</div><button class="ar" data-act="calnext">›</button></div>
  <p class="muted small" style="text-align:center">${mp.length} practices · ${durStr(total({blocks:mp.flatMap(p=>p.blocks)}))} this month · tap a day to open its week</p>
  <div class="mgrid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('')}`;
  let d=gs;
  for(let i=0;i<42;i++){
    const dt=parseD(d); if(i>=35&&dt.getMonth()+1!==m) break;
    const ps=teamPlansOn(d);
    h+=`<button class="mcell ${dt.getMonth()+1!==m?'out':''} ${d===td?'today':''}" data-act="gotoweek" data-id="${d}"><span class="n">${dt.getDate()}</span>${ps.map(p=>`<span class="pd" title="${esc(p.focus||'Practice')}">${fmt(toM(p.start))}</span>`).join('')}</button>`;
    d=addDays(d,1);
  }
  return h+'</div>';
}

function vTemplates(){

  const tm=(id,r)=>{let t=S.templates.find(t=>t.id===id); if(!t) return ''; if(r&&(r.trim||r.teamOnly||r.start)) t=trimmed(t,r.trim||0,r.start||t.start,r.teamOnly); return fmt(toM(t.start),1)+'–'+fmt(toM(t.start)+total(t),1)+(r&&r.trim?' · '+r.trim+' min shorter':'')+(r&&r.teamOnly?', all team':'');};

    '<button class="btn sm gold mt" data-act="addrule">+ Add repeating day</button></div>';
  h+='<h2>Templates</h2><p class="muted small">Save any plan as a template from the plan screen, then start new plans from it here.</p>';

  return h;
}

function mkGroup(n){const p=curPlan(); const g={id:uid(),name:n,start:p.start,blocks:[]}; p.groups.push(g); schedKey=g.id; save(); closeSheet(); render();}
function ruleSheet(){
  sheet(`<h3>Add repeating day</h3>
  <div class="grid2"><div><label class="f">Day</label><select class="in" id="rd">${DOWS.map((d,i)=>`<option value="${i+1}">${d}</option>`).join('')}</select></div>
  <div><label class="f">Sport</label><select class="in" id="rt">${TEAMS.map(t=>`<option value="${t.id}" ${S.team===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div></div>
  <div class="mt"><label class="f">Template</label><select class="in" id="rtp">${S.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
  <div class="grid2 mt"><div><label class="f">Minutes shorter</label><input class="in" id="rtr" type="number" min="0" step="5" value="0"></div>
  <div><label class="f">Start time</label><input class="in" id="rst" type="time" value=""></div></div>
  <label class="row mt" style="gap:8px"><input type="checkbox" id="rto"> <span>Whole team together (no position groups)</span></label>
  <p class="muted small">Use "minutes shorter" to run a shortened copy of a template (like softball off the baseball plan). Time comes out of the group work.</p>
  <div class="grid2 mt2"><button class="btn" data-act="close">Cancel</button><button class="btn gold" id="radd">Add</button></div>`);
  document.getElementById('radd').onclick=()=>{const r={id:uid(),dow:+document.getElementById('rd').value,team:document.getElementById('rt').value,tplId:document.getElementById('rtp').value};
    const tr=+document.getElementById('rtr').value||0, st=document.getElementById('rst').value; if(tr>0) r.trim=tr; if(st) r.start=st; if(document.getElementById('rto').checked){r.teamOnly=true; r.trim=r.trim||0;}
    S.rules.push(r);save();closeSheet();render();};
}
function newPlanSheet(){
  sheet(`<h3>New practice plan</h3>${newDate?`<p class="muted" style="margin-top:-6px">${dateStr(newDate)}</p>`:''}<button class="btn gold full" data-act="blankplan">Start blank</button>
    ${S.templates.length?'<h2 style="font-size:17px">Or start from a template</h2>'+S.templates.map(t=>`<button class="btn full" style="margin-bottom:8px;justify-content:space-between" data-act="usetpl" data-id="${t.id}"><span>${esc(t.name)}</span><span class="muted small">${durStr(t.blocks.reduce((a,b)=>a+(+b.min),0))}</span></button>`).join(''):''}
    <button class="btn full mt" data-act="close">Cancel</button>`);
}
function tplNameSheet(){
  const p=curPlan();
  sheet(`<h3>Save as template</h3><label class="f">Template name</label><input class="in" id="tn" value="${esc(p.focus||'My practice')}">
  <div class="grid2 mt2"><button class="btn" data-act="close">Cancel</button><button class="btn gold" id="tsave">Save template</button></div>`);
  document.getElementById('tsave').onclick=()=>{const cp=JSON.parse(JSON.stringify(p)); S.templates.unshift({id:uid(),name:document.getElementById('tn').value.trim()||'Template',start:p.start,focus:p.focus,gear:p.gear||'',quote:'',blocks:cp.blocks,groups:cp.groups});save();closeSheet();toast('Template saved');};
}

function newPlan(tpl){
  backTo=view==='cal'?'cal':'plans';
  const p={id:uid(),team:S.team,date:newDate||todayISO(),start:tpl?tpl.start:'15:00',location:'',focus:tpl?tpl.focus:'',notes:'',
    gear:tpl?(tpl.gear||''):'',quote:'',blocks:tpl?JSON.parse(JSON.stringify(tpl.blocks)):[],groups:tpl&&tpl.groups?JSON.parse(JSON.stringify(tpl.groups)):defGroups(tpl?tpl.start:'15:00')};
  schedKey='team';
  newDate=null;S.plans.push(p);save();editingId=p.id;view='edit';closeSheet();render();window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('a[href]')) return;
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id, p=curPlan(); const o=p&&(view==='edit'||view==='library')?sched(p).obj:null;
  if(a==='closebg'){ if(e.target===el) closeSheet(); return; }
  if(RO){ const ok=['close','team','nav','calmode','caltoday','calprev','calnext','gotoweek','copy','libcat','vidtab','expd','sched','signout'];
    if(a==='open'){ editingId=id; backTo=view==='cal'?'cal':'plans'; view='card'; render(); window.scrollTo(0,0); return; }
    if(a==='back'){ view=backTo; render(); return; }
    if(!ok.includes(a)) return; }
  if(a==='signout'){ window.PP_signOut&&window.PP_signOut(); return; }
  if(a==='teamview'){ view='team'; render(); window.PP_loadTeam&&window.PP_loadTeam(); return; }
  if(a==='addmember'){ const em=(document.getElementById('tm-e').value||'').trim().toLowerCase(), r=document.getElementById('tm-r').value; if(!/^\S+@\S+\.\S+$/.test(em)){toast('Enter an email');return;} window.PP_addMember(em,r); return; }
  if(a==='rmmember'){ confirmSheet('Remove '+id+' from the team?',()=>window.PP_rmMember(id)); return; }
  if(a==='setrole'){ const [em,r]=id.split('|'); window.PP_addMember(em,r); return; }
  switch(a){
    case 'close': closeSheet(); break;
    case 'mirrorday': {const bp=S.plans.find(x=>x.team==='gcc'&&x.date===p.date);
      if(!bp){toast('No baseball plan on this day');break;}
      confirmSheet('Replace this softball plan with the baseball plan, 30 min shorter?',()=>{const c=trimmed(bp,30,p.start,true);
        Object.assign(p,{focus:c.focus,gear:c.gear,blocks:c.blocks.map(b=>({...b,id:uid()})),groups:c.groups.map(g=>({...g,id:uid()}))});
        schedKey='team';save();render();toast('Rebuilt from baseball');},'Replace'); break;}
    case 'addrule': if(!S.templates.length){toast('Make a template first');break;} ruleSheet(); break;
    case 'delrule': S.rules=S.rules.filter(r=>r.id!==id); save(); render(); break;
    case 'fillweek': {const n=fillWeek(calWeek); save(); render(); toast(n?'Added '+n+' practice'+(n>1?'s':''):'Week already filled'); break;}
    case 'sched': schedKey=id; render(); break;
    case 'addgroup': addGroupSheet(); break;
    case 'mkgroup': mkGroup(id); break;
    case 'delgroup': confirmSheet('Remove the '+o.name+' group and its blocks?',()=>{p.groups=p.groups.filter(g=>g.id!==o.id);schedKey='team';save();render();},'Remove'); break;
    case 'team': S.team=id; save(); if(view==='edit'||view==='card') view='plans'; render(); break;
    case 'nav': view=id; pickMode=false; render(); window.scrollTo(0,0); break;
    case 'newplan': newDate=null; newPlanSheet(); break;
    case 'newon': newDate=id; newPlanSheet(); break;
    case 'calmode': calMode=id; if(id==='month') calMonth=calWeek.slice(0,7); render(); break;
    case 'caltoday': calWeek=weekStart(todayISO()); calMonth=todayISO().slice(0,7); render(); break;
    case 'calprev': case 'calnext': {const k=a==='calprev'?-1:1;
      if(calMode==='week') calWeek=addDays(calWeek,7*k);
      else {let [y,m]=calMonth.split('-').map(Number); m+=k; if(m<1){m=12;y--;} if(m>12){m=1;y++;} calMonth=y+'-'+String(m).padStart(2,'0');}
      render(); break;}
    case 'gotoweek': calWeek=weekStart(id); calMode='week'; render(); window.scrollTo(0,0); break;
    case 'copyweek': {const ps=S.plans.filter(p=>p.team===S.team&&p.date>=addDays(calWeek,-7)&&p.date<addDays(calWeek,0));
      if(!ps.length){toast('Nothing planned last week');break;}
      const doCopy=()=>{ps.forEach(p=>{const c=JSON.parse(JSON.stringify(p));c.id=uid();c.date=addDays(p.date,7);c.blocks.forEach(b=>b.id=uid()); c.groups.forEach(g=>g.id=uid());S.plans.push(c);});save();render();toast('Copied '+ps.length+' plan'+(ps.length>1?'s':''));};
      const have=S.plans.some(p=>p.team===S.team&&p.date>=calWeek&&p.date<=addDays(calWeek,6));
      if(have) confirmSheet('This week already has plans. Add last week\'s too?',doCopy,'Copy anyway'); else doCopy(); break;}
    case 'blankplan': newPlan(null); break;
    case 'usetpl': newPlan(S.templates.find(t=>t.id===id)); break;
    case 'deltpl': confirmSheet('Delete this template?',()=>{S.templates=S.templates.filter(t=>t.id!==id);S.rules=S.rules.filter(r=>r.tplId!==id);save();render();}); break;
    case 'open': schedKey='team'; backTo=view==='cal'?'cal':'plans'; editingId=id; view='edit'; render(); window.scrollTo(0,0); break;
    case 'back': view=pickMode?'edit':'edit'; pickMode=false; render(); break;
    case 'card': view='card'; render(); window.scrollTo(0,0); break;
    case 'copy': {const txt=cardText(p);
      try{navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>showText(txt));}catch(err){showText(txt);} break;}
    case 'up': case 'down': {const i=o.blocks.findIndex(b=>b.id===id),j=a==='up'?i-1:i+1; if(j<0||j>=o.blocks.length)break;
      [o.blocks[i],o.blocks[j]]=[o.blocks[j],o.blocks[i]]; save(); render(); break;}
    case 'editblk': blockSheet(o.blocks.find(b=>b.id===id),false); break;
    case 'addblk': blockSheet({id:uid(),name:'',cat:'def',min:10,stations:[],notes:''},true); break;
    case 'mm': syncDraft(); draft.min=Math.max(1,draft.min+(+id)); document.getElementById('bmv').textContent=draft.min; break;
    case 'addst': syncDraft(); draft.stations.push({group:'',drill:'',coach:''}); draft._draw(); break;
    case 'rmst': syncDraft(); draft.stations.splice(+id,1); draft._draw(); break;
    case 'saveblk': {syncDraft(); const {_isNew,_draw,...b}=draft; if(!b.name.trim()) b.name=CATS[b.cat].label;
      if(_isNew) o.blocks.push(b); else o.blocks[o.blocks.findIndex(x=>x.id===b.id)]=b; save(); closeSheet(); render(); break;}
    case 'dupblk': {syncDraft(); const {_isNew,_draw,...b}=draft; const i=o.blocks.findIndex(x=>x.id===b.id); o.blocks.splice(i+1,0,{...JSON.parse(JSON.stringify(b)),id:uid()}); save(); closeSheet(); render(); break;}
    case 'delblk': o.blocks=o.blocks.filter(x=>x.id!==draft.id); save(); closeSheet(); render(); break;
    case 'pick': {const gn=schedKey==='team'?'':((p.groups.find(g=>g.id===schedKey)||{}).name||'').toLowerCase(); libCat=gn.startsWith('infield')?'inf':gn.startsWith('outfield')?'of':'all';} pickMode=true; view='library'; render(); window.scrollTo(0,0); break;
    case 'pickdrill': {const d=S.drills.find(x=>x.id===id); o.blocks.push({id:uid(),name:d.name,cat:d.cat,min:d.min||10,stations:[],notes:'',video:d.video||''}); save(); toast('Added to '+(schedKey==='team'?'team':o.name)+': '+d.name); break;}
    case 'libcat': libCat=id; render(); break;
    case 'vidtab': vidTab=id; vidQ=''; render(); window.scrollTo(0,0); break;
    case 'expd': openDr.has(id)?openDr.delete(id):openDr.add(id); {const y=window.scrollY; render(); window.scrollTo(0,y);} break;
    case 'newdrill': drillSheet({id:uid(),name:'',lib:libCat==='all'?'team':libCat,cat:LIBS[libCat==='all'?'team':libCat].cat,min:10,desc:'',custom:true},true); break;
    case 'editdrill': e.stopPropagation(); drillSheet(S.drills.find(x=>x.id===id),false); break;
    case 'savetpl': tplNameSheet(); break;
    case 'dupplan': {const c={...JSON.parse(JSON.stringify(p)),id:uid(),date:todayISO()}; c.blocks.forEach(b=>b.id=uid()); S.plans.push(c); editingId=c.id; save(); render(); toast('Duplicated for today'); window.scrollTo(0,0); break;}
    case 'delplan': confirmSheet('Delete this plan?',()=>{S.plans=S.plans.filter(x=>x.id!==p.id);view=backTo;save();render();}); break;
  }
});
function showText(txt){sheet(`<h3>Copy plan</h3><textarea class="in" style="min-height:300px;font-family:monospace;font-size:12px">${esc(txt)}</textarea><button class="btn full mt" data-act="close">Done</button>`);}

document.addEventListener('input',e=>{
  const f=e.target.dataset.f;
  if(f){const p=curPlan(); p[f]=e.target.value; save();
    if(f==='start'||f==='date'){ /* re-render times without losing focus on text fields */ const y=window.scrollY; render(); window.scrollTo(0,y);} }
  if(e.target.dataset.gf){const g=sched(curPlan()).obj; g[e.target.dataset.gf]=e.target.value; save(); if(e.target.dataset.gf==='start'){const y=window.scrollY; render(); window.scrollTo(0,y);}}
  if(e.target.id==='vidq'){vidQ=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById('vidq'); q.focus(); q.setSelectionRange(pos,pos);}
  if(e.target.id==='libq'){libQ=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById('libq'); q.focus(); q.setSelectionRange(pos,pos);}
});

document.addEventListener('change',e=>{if(e.target.dataset.gf==='name'){const y=window.scrollY;render();window.scrollTo(0,y);}});
render();
</script>
<script>
/* Practice Plus accounts + cloud sync (Supabase, plain fetch). */
(function(){
const C={url:"https://gtuqzlphguafdapbkult.supabase.co",key:"sb_publishable_NxaZR82VXGHCPCcvwSwqig_1K2qGt-E"};
const AK='pp_auth'; let sess=null; try{sess=JSON.parse(localStorage.getItem(AK)||'null');}catch(e){}
const H=(t,x)=>Object.assign({apikey:C.key,'Content-Type':'application/json'},t?{Authorization:'Bearer '+t}:{},x||{});
const keep=s=>{sess=s;try{s?localStorage.setItem(AK,JSON.stringify(s)):localStorage.removeItem(AK);}catch(e){}};
const mk=j=>j&&j.access_token?{access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+((j.expires_in||3600)*1000)-60000,email:((j.user&&j.user.email)||'').toLowerCase()}:null;
async function auth(path,body){const r=await fetch(C.url+'/auth/v1/'+path,{method:'POST',headers:H(),body:JSON.stringify(body)});let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){let m=j.error_description||j.msg||j.message||'Sign-in failed';if(/invalid login/i.test(m))m='Wrong email or password.';if(/already registered/i.test(m))m='That email already has an account. Sign in instead.';throw new Error(m);}return j;}
async function tok(){if(!sess)throw new Error('signed-out');if(Date.now()>sess.exp){try{const n=mk(await auth('token?grant_type=refresh_token',{refresh_token:sess.refresh_token}));if(!n.email)n.email=sess.email;keep(n);}catch(e){if(navigator.onLine===false)return sess.access_token;keep(null);throw e;}}return sess.access_token;}
async function rest(m,path,body,x){const t=await tok();const r=await fetch(C.url+'/rest/v1/'+path,{method:m,headers:H(t,x),body:body==null?undefined:JSON.stringify(body)});if(!r.ok)throw new Error('http-'+r.status);const tx=await r.text();return tx?JSON.parse(tx):null;}

/* sign-in screen */
let ov=null;
const LOGO='<svg width="64" height="64" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 12 L108 60 L60 108 L12 60 Z" fill="none" stroke="#2a5bd7" stroke-width="8" stroke-linejoin="round"/><rect x="54" y="42" width="12" height="36" rx="3" fill="#f2b705"/><rect x="42" y="54" width="36" height="12" rx="3" fill="#f2b705"/></svg>';
const IN='width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #22314f;background:#0f1a2e;color:#e8edf7;font-size:16px;margin-bottom:8px';
function gate(msg,mode){
  if(!ov){ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;z-index:99999;background:#0a1222;color:#e8edf7;display:flex;align-items:center;justify-content:center;padding:20px;font:16px/1.4 system-ui,-apple-system,sans-serif;overflow:auto';document.body.appendChild(ov);}
  const up=mode==='up';
  ov.innerHTML='<form style="width:100%;max-width:360px"><div style="text-align:center;margin-bottom:18px">'+LOGO+'<div style="font-weight:800;letter-spacing:.06em;margin-top:8px">PRACTICE <span style="color:#f2b705">PLUS</span></div></div>'
  +'<div style="color:#9fb0cc;font-size:14px;margin-bottom:10px;text-align:center">'+(up?'Create your account with the email your coach added.':'Sign in to see practice plans.')+'</div>'
  +'<label for="pp-e" style="font-size:13px;color:#9fb0cc">Email</label><input id="pp-e" type="email" autocomplete="email" style="'+IN+'">'
  +'<label for="pp-p" style="font-size:13px;color:#9fb0cc">Password'+(up?' (6+ characters)':'')+'</label><input id="pp-p" type="password" autocomplete="'+(up?'new-password':'current-password')+'" style="'+IN+'">'
  +(msg?'<div role="alert" style="color:#ff9b9b;font-size:14px;margin:4px 0 10px">'+msg+'</div>':'')
  +'<button type="submit" style="width:100%;padding:13px;border:0;border-radius:10px;background:#f2b705;color:#0a1222;font-weight:800;font-size:16px;margin-top:6px">'+(up?'Create account':'Sign in')+'</button>'
  +'<button type="button" id="pp-sw" style="display:block;width:100%;background:none;border:0;color:#8fb2ff;font-size:15px;margin-top:14px;padding:8px;cursor:pointer">'+(up?'I already have an account':'First time? Create an account')+'</button></form>';
  ov.querySelector('#pp-sw').onclick=()=>gate('',up?'in':'up');
  ov.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const em=ov.querySelector('#pp-e').value.trim().toLowerCase(),pw=ov.querySelector('#pp-p').value;
    if(!em||!pw){gate('Enter your email and password.',mode);return;}
    const b=ov.querySelector('button[type=submit]');b.disabled=true;b.textContent='One moment…';
    try{const j=up?await auth('signup',{email:em,password:pw}):await auth('token?grant_type=password',{email:em,password:pw});
      if(!j.access_token){gate('Check your email for a confirmation link, then come back and sign in.','in');return;}
      const n=mk(j);if(!n.email)n.email=em;keep(n);start();}catch(e){gate(e.message||'Couldn’t sign in.',mode);}};
}
function denied(){gate('','in');ov.innerHTML='<div style="width:100%;max-width:360px;text-align:center">'+LOGO+'<div style="font-weight:800;margin:12px 0 8px">Signed in as '+sess.email+'</div><div style="color:#9fb0cc;margin-bottom:16px">That email isn’t on the team list yet. Ask your coach to add it, then open the app again.</div><button id="pp-so" style="padding:12px 18px;border:0;border-radius:10px;background:#22314f;color:#e8edf7;font-size:16px">Sign out</button></div>';ov.querySelector('#pp-so').onclick=()=>{keep(null);location.reload();};}
const close=()=>{if(ov){ov.remove();ov=null;}};

/* sync */
let pushT=null, last='', busy=false;
let pending=false;
function busyUI(){const l=document.getElementById('layer');return pending||(l&&l.children.length)||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));}
const newFlags=(loc,rem)=>Object.keys(loc).some(k=>/(V\d+|Undo)$/.test(k)&&loc[k]&&!rem[k]);
async function pull(first){
  const a=await rest('GET','pp_docs?select=data,updated_at&path=eq.state');
  if(a&&a[0]&&a[0].data){ if(first&&!RO&&newFlags(S,a[0].data)){ await push(); return; } const js=JSON.stringify(a[0].data);if(js!==last){ if(!first&&busyUI())return; last=js; S=a[0].data; try{localStorage.setItem('practiceplus_v1',js);}catch(e){} const y=window.scrollY; render(); window.scrollTo(0,y);} }
  else if(first&&!RO){ await push(); }
}
async function push(){ if(RO||!sess)return; const js=JSON.stringify(S); if(js===last)return; last=js;
  try{ await rest('POST','pp_docs?on_conflict=path',{path:'state',data:S,updated_at:new Date().toISOString()},{Prefer:'resolution=merge-duplicates,return=minimal'}); }
  catch(e){ last=''; if(window.toast) toast('Not saved to the team yet. Check your connection.'); } }
window.PP_push=()=>{ if(RO||!ACCT)return; pending=true; clearTimeout(pushT); pushT=setTimeout(async()=>{ await push(); pending=false; },800); };
window.PP_signOut=()=>{keep(null);location.reload();};
window.PP_loadTeam=async()=>{ try{ TEAMLIST=await rest('GET','pp_members?select=email,role&order=role.asc,email.asc')||[]; }catch(e){ TEAMLIST=[]; toast('Couldn’t load the team list'); } if(view==='team') render(); };
window.PP_addMember=async(em,r)=>{ try{ await rest('POST','pp_members?on_conflict=email',{email:em,role:r},{Prefer:'resolution=merge-duplicates,return=minimal'}); toast(em+' is a '+r); await PP_loadTeam(); }catch(e){ toast('Couldn’t save. Try again.'); } };
window.PP_rmMember=async em=>{ try{ await rest('DELETE','pp_members?email=eq.'+encodeURIComponent(em),null,{Prefer:'return=minimal'}); await PP_loadTeam(); }catch(e){ toast('Couldn’t remove. Try again.'); } };

async function start(){
  if(!sess){gate('','in');return;}
  let role=null;
  try{ await tok(); const a=await rest('GET','pp_members?select=role&email=eq.'+encodeURIComponent(sess.email)); role=a&&a[0]?a[0].role:'none'; try{localStorage.setItem('pp_role',role);}catch(e){} }
  catch(e){ if(!sess){gate('','in');return;} role=localStorage.getItem('pp_role')||'none'; }
  if(role==='none'){denied();return;}
  ACCT={email:sess.email,role}; RO=role!=='coach';
  close(); if(RO&&(view==='edit'||view==='templates'))view='cal'; render();
  try{ await pull(true); }catch(e){}
  setInterval(()=>{ if(!document.hidden) pull(false).catch(()=>{}); }, RO?20000:45000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull(false).catch(()=>{}); });
}
start();
})();
</script>
