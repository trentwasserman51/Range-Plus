const DTL={pre:"Pre-pitch",step:"First step",range:"Range",catch:"Catch",throw:"Throw"};
const DD={
"Game Clock (Meet or Beat Clock)":["A play is made while a shot clock runs from the ball being hit or fielded to glove-to-target. He has to meet or beat the time standard.","For a player whose throws are accurate but late, or who loses time in the transfer and feet under pressure. A low Timing ✓ on the Leaders page points here.","The clock gives him an objective target instead of a feel. He learns the pace the play really needs, cuts wasted movement between catch and release, and gets used to throwing on time without giving up accuracy."],
"Separator Play":["A full play, from ball to throw, on a chance hard enough to separate good defenders from average ones, run at game intensity.","For a player whose routine plays are fine but whose 4–5★ results sit below expected, or who needs to push his range out. Tough chances are where outs above average come from.","Reps at the edge of his range teach him what he can reach and how to finish the play from there. Keep it near a 70% success rate: if he makes everything, move the ball farther."],
"Situational Separator Play":["The same hard play with a game situation attached, such as runner speed, number of outs and which base to throw to.","For a player who makes the play in practice but loses tempo or makes the wrong throw decision with a runner or the clock in mind.","It adds decision and urgency to the physical skill, so his throw choice and speed match what the game demands."],
"Flip Fungo Mass":["A coach flips fungo grounders in quick succession and the fielder plays each one from pre-pitch through the throw.","For high-volume work on the full play when he needs lots of quality reps in a short window, such as game prep.","High-tempo reps off a real batted ball build rhythm between pre-pitch, first step, catch and throw, and sharpen the transfer and arm while he is a little tired."],
"Live BP w/o Runners":["The fielder plays his position against live batting practice, reading real batted balls and throwing to a base. No runners.","The closest thing to the game we can get. Use it when a skill looks good on a machine or fungo but does not show up in games, and to prepare for games.","Real bat sound, spin and speed train reads and first step in a way a machine can not, and the throw finishes the play. Prioritize live reads across a whole development cycle."],
"BP Option 4 (Pre-Pitch Full Play)":["Live BP where he does his pre-pitch on every pitch and plays every ball hit to him all the way through the throw.","For a player whose pre-pitch (being on the way down at contact) is inconsistent, so his first step and range suffer.","It ties the pre-pitch timing to the pitch, so he learns to be moving at contact. Because he finishes the play, the better start carries into range, catch and throw."],
"Self Fed Mass Fungo":["The player hits himself ground balls one after another and plays each one through the throw.","For extra volume when no coach is available, or to groove footwork and the transfer on his own.","Lots of repetition on catch and throw mechanics. It is weaker for range and first step because he knows where the ball is going, so pair it with batted-ball work."],
"Machine Range Ruler":["A machine shoots balls to spots farther and farther to either side so you can see how far he reaches, and he finishes with a throw.","For a range problem: low range success, low OAA, or a weak side on the Direction columns. It gives a clear measure of how far he gets.","The machine is precise, so he gets high-intensity, rangy reps at exact spots. He sees the edge of his range and the goal is to push it out over the weeks. Pre-pitch matters less here because there is no batted ball."],
"Random Flip Fungo w/ Throw":["The coach flips fungos to random spots and directions. The fielder plays each one and throws to a target.","For a player who only looks good when he knows where the ball is going. It trains the whole play with variability.","Unpredictable directions force real reads and first steps. Finishing with a throw to a target keeps ball security and the throw tied to the effort."],
"N/S/E/W Machine":["The machine feeds balls in four directions around the fielder (in, back, glove side, backhand side). No throw.","For a player with a weak direction, such as the backhand side or charging in, and for first step and range work at high intensity.","Reps in every direction expose a weak one and fix it. Skipping the throw keeps volume and intensity high, so you get more range reps in less time."],
"Machine Angle Work":["The machine feeds ground balls at different angles so he practices the footwork each path needs.","For a player whose path to the ball is inefficient: an arc that is too wide, getting around the ball late, or poor footwork to one side.","He repeats a clean angle until the path becomes automatic. That shows up as a direct path, a better first step and more range."],
"Flip Fungo Hop Reads":["Flip fungos where the focus is reading the hop and choosing how to play it: short hop, long hop or in between.","For a fielder who gets tied up by bad hops, hesitates, or lets the ball play him.","Seeing many hops teaches him to pick the hop he wants and attack it, which helps ball security and the first step into the ball."],
"Count Hops":["He counts or calls out the hops as the ball comes to him.","For a player who watches the ball late or stops reading the hops as it arrives.","Counting keeps his eyes locked on the ball and forces an early read of the hop, so the catch gets cleaner."],
"BP Option 3 (Pre-Pitch to Catch)":["Live BP: pre-pitch, first step, range and catch on every ball hit to him. He stops after the catch, no throw.","For work on contact-to-catch when throwing volume is a concern or on a no-throw day.","He gets many live reps at contact-to-catch, the biggest predictor of a defender's value, without adding arm stress."],
"Self Fed Fungo (Random)":["He hits himself ground balls to random spots and fields them, usually finishing with a throw.","For general reps and footwork on his own when a coach is not available.","Random spots keep it from becoming rote and the self-feed gives volume. Pre-pitch is light because he is the one hitting the ball."],
"DP Machine Ruler":["A machine range ruler where each ball is played and turned as a double play, such as the feed or the turn.","For a middle infielder who needs range and double-play footwork together. It is a low-workload version.","It joins range with the feed or turn, so the footwork into the throw gets practiced while he stays on the move."],
"Red Rocket Ruler":["A ruler drill using the Red Rocket, an easy machine that can shoot real baseballs, to spots at increasing distance.","For range work on a low-workload day, or when only a simple machine is available.","The same idea as the Machine Range Ruler at lower intensity: staying on the move through the ball and getting range reps without much stress on the body."],
"Random Flip Fungo w/o Throw":["Flip fungos to random spots. He plays each ball to the catch and does everything but the throw.","For a no-throw day, or when the arm needs a break.","He keeps the first step, range and catch work and moves his feet toward the target without the throw. We call this everything but the throw."],
"BP Option 2 (Pre-Pitch 3 Steps)":["Live BP: pre-pitch and the first three steps on every ball hit to him, then he stops.","For a player who needs work on pre-pitch and first step but not the whole play.","Low-workload reps that link timing and the first steps to a real pitch, building a first step that goes the right way."],
"BP Stop":["Live BP: pre-pitch and the first step, then he stops and watches the ball finish.","For a player whose pre-pitch or first step is the main issue.","Very low workload. He gets many reps of getting on the way down at contact and reading the ball off the bat."],
"BP Option 1 (Pre-Pitch 1 Step)":["Live BP: pre-pitch and a single first step on every ball, then he stops.","For the lightest version of pre-pitch and first step work.","It trains the most important start of the play, being on time with the feet, with almost no wear on the body."],
"Screened Pre Pitch":["Pre-pitch reps from behind a screen while a hitter or coach hits. The ball is not coming at him.","For a player who needs pre-pitch timing reps with no risk, or a lot of reps in a short time.","He practices organizing his feet to the pitch and the swing, so he is already moving when the ball is hit."],
"Turf Work":["Routine ground balls on turf, often with Lite Flite or real balls, usually with throwdown bases.","A daily routine for every player. It builds confidence and ball security and lets you nudge small improvements.","Quality catch reps in a controlled setting. It is the base the harder drills sit on, and it should be a daily part of programming."],
"Dual Machine Picks":["Two machines feed different hops so he has to pick the ball out of varied bounces.","For a player who needs work on ball security and hand work, especially with mixed-bag balls.","Varied hops force quick adjustments and clean catches. It trains the hands and the catch tool without needing range or a throw."]};
const DW=[["Routines","Daily turf or machine work that builds confidence and nudges small improvements."],["Reps","Fungo reps, self-fed or flip, are a staple of both team and individual work."],["Targeted drill work","The biggest mover of development. Game-like intensity, only 2–3 times a week."],["Live BP reads","The closest to the game. Prioritize them across the whole cycle."]];
const TPR=[["Couple reps with a throw to a target.","Pair as many reps as you can with a throw to a real target. If it is a no-throw day, do everything but the throw: secure the ball and move the feet toward the target."],["A good throw is strong, accurate and on time.","Grade all three. A throw that is strong and accurate but late still loses the out."],["Use regular baseballs when throwing is the focus.","Lite Flite balls are for turf and lead-up work. Switch to real baseballs when the throw is the point."],["Use plyo-mat targets for accuracy.","A specific spot to hit shows accuracy better than just “threw it to first.”"],["Use the game clock for timing.","Speaker and shot clock app so glove to target has to be on time."],["Train throws the way they happen in games.","Games bring throws on the run, off balance and from odd angles. Train the ones he struggles with, with variability, instead of only set throws."],["Use catch play as the daily delivery.","Catch play is already in every day. Add one throw variation to it for a few minutes, and the reps stack up with no extra workload."],["Build up slowly.","Add speed or difficulty only after he is accurate at the easier level. Aim for about a 70% success rate."]];
const TP={
"On the run":{tc:"Football-style throws on the run in daily catch play, 10–15 a day, then to a plyo-mat target.",fix:"Throws that go off line or late when he is moving through the ball: charge plays, slow rollers, bare-hand plays, and balls he fields on the move.",cp:"Football throws on the run. Partners 40–60 ft apart. He jogs toward a throw line and throws on the move, like a quarterback rolling out, to both sides. 10–15 a day.",pg:"1) Walk through the throw at a target. 2) Jog and throw. 3) Field a short fungo or a roll, then throw through it. 4) Fungo or machine ball on the run with the game clock.",rp:"10–15 football throws in catch play every day. On a High day, 5–8 on-the-run throws to a plyo-mat target after a real fielded ball.",why:"Throwing on the run is a skill of its own. He has to keep the hips and feet pointed at the target while his body is still moving. Rehearsing it when it is easy makes it automatic when it counts."},
"Off-balance":{tc:"Throws from drift, spin and one knee in catch play, 8–10 a day, partner picks the angle.",fix:"Throws from awkward positions: across the body, falling away, from the knees, after a dive, or off the wrong foot.",cp:"Throws from awkward spots. Partner calls the angle: across the body, off one knee, drifting sideways, after a quick spin. 8–10 a day at about 70% effort.",pg:"1) Slow, from a knee. 2) Moving sideways with a drift. 3) After a quick spin or a ball to the backhand side. 4) Fungo or machine ball, then throw with the game clock.",rp:"8–10 awkward-position throws in catch play each day. On a High day, play them off fungo or machine balls to a plyo-mat target.",why:"Off-balance throws decide tough plays. The goal is to find a quick throwing base or a short, clean arm action from wherever he ends up, so he does not rush or lose the ball."},
"Jump":{tc:"A few jump throws in catch play, 5–8 a day, working on a clean landing and aiming the hips.",fix:"Jump throws from the hole or on the backhand side, where he has to leave the ground to get the ball across.",cp:"Jump throws in catch play after he is warm. Start at 40–50 ft at about 70% effort. 5–8 a day. Focus on the landing and keeping hips and shoulders pointed at the target.",pg:"1) Standing jump throw at a short distance. 2) Jump after a backhand pick. 3) Jump from a deeper spot. 4) Fungo or machine ball, then jump throw with the clock.",rp:"5–8 jump throws in catch play daily, and the same on a High day off a fungo ball.",why:"Jump throws are on the plays that separate infielders: deep-hole and backhand chances. He will not have the time to set his feet, so he needs to rehearse it."},
"Set":{tc:"Start catch play with the footwork pattern he struggles with (1-step, 2-step shuffle or crow hop), 10 a day.",fix:"Throws with time to set the feet that are still off line or late. These should be the most consistent throws.",cp:"Name the footwork pattern before each set of catch play: quick release, 1-step shuffle, 2-step shuffle, crow hop. 10 a day, to a target.",pg:"1) Pattern at short distance. 2) Pattern at full distance. 3) Pattern off a fungo ball. 4) Pattern with the game clock.",rp:"10 footwork-pattern throws in catch play every day, and again off fungo balls on Moderate and High days.",why:"Set throws are the most common throw. A repeatable footwork pattern gives him a throw he can trust, and it carries over to every other throw."},
"Flip":{tc:"Glove flips and underhand tosses from 15–30 ft in catch play, 10 a day.",fix:"Short flips and underhand tosses on double plays or plays near the bag that are soft, late or off target.",cp:"Flips and underhand tosses from 15–30 ft, plus backhand flips. 10 a day, with a partner holding a target at chest height.",pg:"1) Set flip to a target. 2) Flip after a short ground ball. 3) Backhand flip. 4) Machine or fungo ball with the clock.",rp:"10 flips in catch play daily and as part of any double-play drill.",why:"A flip has to be soft, on target and fast. Small errors cost the double play."}};
const SC={"Quick release (no shuffle)":"Ball out fast with little footwork. Used on short plays when time is tight. Work on quick hands and a short arm action.","1-step shuffle":"One gather step toward the target, then throw. The common set throw on routine plays. Keep the step on a line to the target.","2-step shuffle":"Two small steps to get feet and hips lined up, used on longer throws or when he has time. Stay under control and do not over-shuffle.","Crow hop":"A hop toward the target to build momentum on a long throw from deep in the hole. Hop on line, not around the target.","Backhand drop step":"Plant after a backhand pick and drop the back foot to turn to the target. Get the turn done before the throw.","Throw-through (right-left)":"Field in rhythm and throw through the momentum on a charge play. Keep the feet moving toward the target.","Bare-hand and throw":"Pick a slow roller bare-handed and throw in one motion. Work on quick hands and a clean grip.","Backhand, on the run":"Throw on the move after fielding to the backhand side. Get the hips turned toward the target as he comes out of the backhand.","Across the body":"Throw when the body is turned away from the target. Rotate the hips and shoulders to the target as the arm comes through.","Falling away":"Throw while drifting away from the target. Keep the arm action short and finish on target.","Sidearm / low slot":"A lower arm slot when time is short. Watch for a throw that sails or tails away.","From the knees":"Throw from one or both knees after a dive or a stop. Use the core and trunk to drive the throw.","After a dive":"Recover and throw after laying out. Get a base under him quickly, then throw.","Off the wrong foot":"Fielded the ball with the wrong foot forward. Use a short hop or a drop step to line up.","Jump throw":"Leave the ground to throw from the hole. Land on balance with the hips pointing at the target.","Backhand jump / spin":"Backhand pick with a jump or spin to turn to first. Needs a clean spin and a clear target.","Glove flip / underhand":"Soft flip to the bag on a double play or close play. Aim at chest height.","Backhand flip":"Backhand glove flip to the bag. Keep the flip soft and on a line."};
